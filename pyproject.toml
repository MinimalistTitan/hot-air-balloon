[build-system]
requires = ["hatchling>=1.28.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "hot-air-balloon-api"
version = "0.1.0"
description = "Production-oriented FastAPI modular monolith reference application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.5,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "azure-storage-blob>=12.30.0,<13.0.0",
    "confluent-kafka>=2.15.0",
    "email-validator>=2.3.0,<3.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "langchain>=1.3.0,<1.3.16",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "prometheus-client>=0.26.0,<1.0.0",
    "psycopg[binary,pool]>=3.3.4,<4.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.52.0,<1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.1,<1.0.0",
]

[project.scripts]
serve = "app.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
