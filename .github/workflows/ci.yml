name: CI

on:
  pull_request:
  push:
    branches: [main, main_library]
  schedule:
    # Weekly vulnerability/freshness early warning, Monday 02:15 UTC.
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install 3.14.6
          uv sync --locked --all-groups --python 3.14.6

      - name: Enforce architecture boundaries
        run: uv run python .github/scripts/architecture_guard.py

      - name: Calculate governance score
        run: uv run python .github/scripts/governance_score.py --min-score 85

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Validate migrations
        env:
          APP_DATABASE_URL: sqlite+aiosqlite:///./migration_ci.db
        run: uv run alembic upgrade head
